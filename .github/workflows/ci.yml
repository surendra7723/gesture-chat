name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv pip install -r requirements.txt -r requirements-api.txt

      - name: Run migrations
        env:
          DJANGO_SETTINGS_MODULE: chatapp.settings
        run: uv run python manage.py migrate

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: chatapp.settings
        run: uv run python manage.py test
